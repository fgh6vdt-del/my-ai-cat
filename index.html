<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой ИИ-Чат</title>
    <style>
        body { font-family: Arial; background: #222; color: white; text-align: center; margin: 0; padding: 20px; }
        #chat-box { width: 90%; max-width: 600px; height: 400px; margin: 20px auto; background: #333; padding: 10px; overflow-y: scroll; border-radius: 10px; text-align: left; }
        .message { margin: 10px; padding: 10px; border-radius: 5px; }
        .user { background: #007bff; text-align: right; margin-left: auto; width: fit-content; max-width: 80%; }
        .ai { background: #444; text-align: left; margin-right: auto; width: fit-content; max-width: 80%; }
        #input-container { display: flex; justify-content: center; gap: 10px; }
        input { width: 60%; padding: 10px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Мой ИИ-Чат</h1>
    <div id="chat-box"></div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Напиши сообщение...">
        <button onclick="sendMessage()">Отправить</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value;
            if (!message) return;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="message user">Вы: ${message}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // ПОКАЗЫВАЕМ, ЧТО ИИ ДУМАЕТ
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message ai';
            loadingMsg.textContent = 'ИИ думает...';
            chatBox.appendChild(loadingMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Сюда мы потом вставим ссылку на наш сервер
                const ответ = await получить('https://my-ai-cat.onrender.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                loadingMsg.textContent = `ИИ: ${data.reply}`;
            } catch (error) {
                loadingMsg.textContent = "Ошибка: Сервер не отвечает.";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
